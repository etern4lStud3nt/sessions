{% extends "layout.html" %}

{% block head %}
<script type="module" src="{{ url_for('static', filename='index.js') }}" defer></script>
<title>Home</title>
{% endblock %}

{% block main %}
<div class="main-div">
        <h1>sessions</h1>
        <div class="timer">
            <div id="display"></div>
            <div id="progress-bubbles" class="progress-bubbles" aria-label="Session progress"></div>
            <button id="start-button">Start</button>
            <button id="stop-button" class="confirmation">Stop</button>
            <button id="reset-button" class="danger">Reset</button>
        </div>
        <a href="{{ url_for('history') }}">View session history</a>
        <a href="{{ url_for('settings') }}">Settings</a>
    </div>
{% endblock %}
