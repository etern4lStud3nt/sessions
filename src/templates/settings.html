{% extends "layout.html" %}

{% block head %}
<title>Settings</title>
<script type="module" src="{{ url_for('static', filename='settings.js') }}" defer></script>
{% endblock %}

{% block main %}
<div class="main-div">
    <h1>Settings</h1>
    <form id="settings-form" action="/settings" method="POST">
        <fieldset>
            <legend>Session Duration</legend>
            <div class="setting-row">
                <label for="focus-duration-min">Focus Duration</label>
                <input type="number" name="focus-duration" id="focus-duration-min">
                <span>minutes</span>
                <input type="number" name="focus-duration" id="focus-duration-sec">
                <span>seconds</span>
            </div>
            <div class="setting-row">
                <label for="break-duration-min">Break Duration</label>
                <input type="number" name="break-duration" id="break-duration-min">
                <span>minutes</span>
                <input type="number" name="break-duration" id="break-duration-sec">
                <span>seconds</span>
            </div>
        </fieldset>

        <button type="submit">Save Settings</button>
    </form>
    
    <fieldset>
        <legend>Danger Zone</legend>
        <div class="setting-row">
            <button class="danger" id="delete-btn">Delete Data</button>
        </div>
    </fieldset>
    <a href="{{ url_for('home') }}">Home</a>
</div>
{% endblock %}
